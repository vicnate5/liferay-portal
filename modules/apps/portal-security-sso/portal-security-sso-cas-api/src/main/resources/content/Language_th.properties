enabled-help=ตั้งค่านี้เป็นจริงเพื่อเปิดใช้งานการเข้าสู่ระบบแบบครั้งเดียวของ CAS (Automatic Translation)
import-from-ldap-help=ผู้ใช้อาจได้รับการรับรองความถูกต้องโดย CAS และยังไม่มีอยู่ในพอร์ทัล ตั้งค่านี้เป็น true เพื่อนําเข้าผู้ใช้จาก LDAP โดยอัตโนมัติถ้าไม่มีผู้ใช้นั้นอยู่ในพอร์ทัล (Automatic Translation)