##
## AI Hub provisioned workspace.
##
## liferay.workspace.home.dir is the entire deploy bridge. Inside the container
## /liferay is the bind mounted DXP bundle home, so `gradlew deploy` writes the
## built artifact to /liferay/deploy and the host DXP hot deploys it.
##

liferay.workspace.home.dir=/liferay
liferay.workspace.product=dxp-2026.q2.8

liferay.workspace.client.extension.dir=client-extensions
liferay.workspace.node.package.manager=npm

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.daemon=false
