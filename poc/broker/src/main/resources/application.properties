#
# Standalone runs read application-default.properties only. When the broker is
# deployed as a client extension, Liferay mounts its routes as config trees and
# the two optional imports below pick them up.
#

spring.config.import=\
    classpath:/application-default.properties,\
    optional:configtree:${LIFERAY_ROUTES_CLIENT_EXTENSION:./.no-routes}/,\
    optional:configtree:${LIFERAY_ROUTES_DXP:./.no-routes}/
