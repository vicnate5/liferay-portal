#
# Broker
#

# Address of the Track A agent sidecar.

broker.sidecar.base-url=http://localhost:8090

# Set to false to run the demo without a DXP on 8080. Every request is then
# forwarded unauthenticated.

broker.auth.enabled=true

broker.auth.dxp-base-url=http://localhost:8080
broker.auth.validation-path=/o/headless-admin-user/v1.0/my-user-account
broker.auth.cache-ttl=60s
broker.auth.timeout=10s

# Origin of the DXP page that hosts the chat custom element.

broker.cors.allowed-origin=http://localhost:8080

#
# Spring Boot
#

server.port=8091

# Compression would coalesce server sent event frames. Leave it off.

server.compression.enabled=false

logging.level.com.liferay.aihub.broker=INFO

spring.main.web-application-type=reactive
spring.mvc.log-request-details=false
