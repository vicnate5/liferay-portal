##
## AI Hub Workspace POC, DXP side client extensions.
##
## liferay.workspace.home.dir points at the local DXP bundle, so `gradlew deploy`
## writes the built client extension archives straight into the bundle deploy
## folder and the running DXP hot deploys them.
##

liferay.workspace.home.dir=/opt/dev/projects/github/bundles

liferay.workspace.product=dxp-2026.q2.8

liferay.workspace.client.extension.dir=client-extensions
liferay.workspace.node.package.manager=npm

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
